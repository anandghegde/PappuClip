# XcodeGen project. The .xcodeproj is generated (Scripts/build.sh) and not committed.
#
# The bundle-identifier prefix repeats ProductIdentity.bundleIDPrefix in PappuCore, because XcodeGen
# cannot read Swift constants. A rename changes both.
name: PappuClip

options:
  bundleIdPrefix: app.pappuclip
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    # macOS ties the Accessibility grant to the code signature, so every build is signed with the
    # same local certificate (Scripts/setup-dev-signing.sh). Scripts/build.sh chooses the identity and
    # exports it for XcodeGen to substitute here. It cannot go on the xcodebuild command line: that
    # would also apply it to the package's resource-bundle targets, which then demand a team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "${PAPPU_SIGN_IDENTITY}"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # Release builds are what Scripts/release.sh archives, re-signs with a Developer ID (hardened
    # runtime, secure timestamp) and notarizes. Debug keeps the development identity above. Xcode never
    # injects get-task-allow into a Release signature; saying so here keeps notarization from finding it.
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

packages:
  PappuKit:
    path: ../Packages/PappuKit
  # PRD §11.4: app updates. Linked by the app target only, behind SoftwareUpdating, so PappuKit's
  # tests never build it.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  # The product (architecture §19). An agent app: the status item is the whole of the UI, the windows
  # are made in code, and everything it does lives in PappuKit's PappuApp.
  PappuClip:
    type: application
    platform: macOS
    sources:
      - path: PappuClip
        excludes: [Info.plist, PappuClip.entitlements]
      # The data the app reads out of its own bundle at launch, filed the way the loaders look for it:
      # the manifests keep their directory (BuiltinExtensions/) and the rest sit at the top of
      # Resources/. AppResources.load(from:) reads the same documents from the repository layout, and
      # AppResourcesTests reads them there, so a typo in one of these fails `swift test`.
      - path: ../Resources/BuiltinExtensions
        type: folder
        buildPhase: resources
      - path: ../Resources/DetectionPolicies/detection-policies.json
        buildPhase: resources
      - path: ../Resources/search-engines.json
        buildPhase: resources
      - path: ../Resources/url-schemes.json
        buildPhase: resources
      - path: ../Resources/top-level-domains.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pappuclip.PappuClip
        INFOPLIST_FILE: PappuClip/Info.plist
        CODE_SIGN_ENTITLEMENTS: PappuClip/PappuClip.entitlements
        GENERATE_INFOPLIST_FILE: NO
        # As for SpikeLab: the debug dylib cannot be loaded under the hardened runtime when the
        # signature has no Team ID, which is the case for the local development certificate.
        ENABLE_DEBUG_DYLIB: NO
        # DIA-4: beta diagnostics are offered only when this is `beta` (Info.plist PappuReleaseChannel).
        # The release pipeline sets it per channel; until then every build is a beta build.
        PAPPU_RELEASE_CHANNEL: beta
        # PRD §11.4. Sparkle is compiled in only when Scripts/release.sh sets PAPPU_UPDATER_CONDITION to
        # PAPPU_SPARKLE, and it passes SUFeedURL's and SUPublicEDKey's values (Info.plist) with it. Every
        # other build leaves all three empty and has no updater. That is not only tidiness: under the
        # hardened runtime, library validation refuses to load Sparkle.framework into a process whose
        # signature has no Team ID — every development build — so those builds must not link it at all.
        # The framework is still embedded; -dead_strip_dylibs drops the load command nothing uses.
        PAPPU_UPDATER_CONDITION: ""
        PAPPU_APPCAST_URL: ""
        PAPPU_SPARKLE_PUBLIC_KEY: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(PAPPU_UPDATER_CONDITION)"
        OTHER_LDFLAGS: "$(inherited) -Wl,-dead_strip_dylibs"
    dependencies:
      - package: PappuKit
        product: PappuApp
      - package: Sparkle
      - target: PappuClipRunner
      - target: PappuClipJSHost

  # AppleScripts and Services (architecture §9.5), embedded in the app as an XPC service. The one
  # target with the Apple-events entitlement; a script that hangs is killed with the process.
  PappuClipRunner:
    type: xpc-service
    platform: macOS
    sources:
      - path: PappuClipRunner
        excludes: [Info.plist, PappuClipRunner.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pappuclip.PappuClip.Runner
        INFOPLIST_FILE: PappuClipRunner/Info.plist
        CODE_SIGN_ENTITLEMENTS: PappuClipRunner/PappuClipRunner.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: PappuKit
        product: PappuRunnerHost

  # Extensions' JavaScript (architecture §10, SEC-1a), embedded in the app as an XPC service.
  # Sandboxed with no other entitlement; each extension gets its own JavaScriptCore world in it.
  PappuClipJSHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: PappuClipJSHost
        excludes: [Info.plist, PappuClipJSHost.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pappuclip.PappuClip.JSHost
        INFOPLIST_FILE: PappuClipJSHost/Info.plist
        CODE_SIGN_ENTITLEMENTS: PappuClipJSHost/PappuClipJSHost.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: PappuKit
        product: PappuJSHost

  # Throwaway host for the M0 spikes (implementation plan §3). Deleted when M0 closes; the harness
  # it drives lives in PappuKit and stays.
  SpikeLab:
    type: application
    platform: macOS
    sources:
      - path: SpikeLab
        excludes: [Info.plist, SpikeLab.entitlements]
      - path: SpikeShared
      # Spike 5's JavaScript, copied as a folder so that bench.js also runs in the jsc tool as it is.
      - path: SpikeFixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pappuclip.SpikeLab
        INFOPLIST_FILE: SpikeLab/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpikeLab/SpikeLab.entitlements
        GENERATE_INFOPLIST_FILE: NO
        # Xcode's debug builds put the code in SpikeLab.debug.dylib. Under the hardened runtime,
        # library validation refuses to load it when the signature has no Team ID, which is the case
        # for the self-signed development certificate. One binary avoids loading anything.
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: PappuKit
        product: PappuCore
      - package: PappuKit
        product: PappuHarness
      # For check-tap-service only, which runs the product's taps on a real session.
      - package: PappuKit
        product: PappuSelection
      - target: SpikeJSHost

  # Spike 5's helper: sandboxed, no JIT entitlement, embedded in SpikeLab as an XPC service.
  SpikeJSHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: SpikeJSHost
        excludes: [Info.plist, SpikeJSHost.entitlements]
      - path: SpikeShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pappuclip.SpikeLab.JSHost
        INFOPLIST_FILE: SpikeJSHost/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpikeJSHost/SpikeJSHost.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
