  # Onboarding
  ONB-1:
    priority: P0
    milestone: M1
    note: >-
      Three separable things, and only the last of them needs a live session. *Which screen a run shows*
      is `OnboardingState`: the welcome comes first whatever the grant says, because an app that asks for
      Accessibility before it has said what it is for is an app whose prompt means nothing, and a grant
      that is trusted-but-refused gets the repair screen rather than the ask again (ONB-4). *What is
      remembered* is `OnboardingStore`, and all it remembers is that the welcome happened: the grant is
      the system's answer and is asked for at every launch, never written down, so a permission revoked
      between launches cannot be read back out of our own defaults as though it still held. *Detecting
      the grant live* — `AXIsProcessTrusted`, the `com.apple.accessibility.api` distributed notification,
      and the tap-creation check that tells a working grant from a stale one — is `AccessibilityMonitor`
      over AppKit; the menu's two ways of saying the grant is missing are tested, and the watcher behind
      them is on the M1 checklist because it needs a real trust database to change. *The window* is
      `OnboardingModel` and the SwiftUI view over it in PappuApp: the model holds the two buttons and
      the closing, the view holds the words, and the assembly hands the model the monitor's request and
      its link to the pane. The one behaviour that is neither a stored setting nor a pure rule — the
      window asking for the permission goes away the moment the permission arrives, rather than leaving
      a Done button for something already done — is the model's, and is tested here.
    tests:
      - PappuCoreTests/anUntrustedProcessIsUntrustedWhateverTheTapDid
      - PappuCoreTests/trustedWithNothingTriedYetIsUntested
      - PappuCoreTests/trustedAndRefusedIsStaleRatherThanMissing
      - PappuCoreTests/onlyAWorkingOrUntestedGrantLetsTheAutomaticPathRun
      - PappuCoreTests/aFreshInstallIsWelcomedFirstWhateverTheGrantSays
      - PappuCoreTests/aWelcomedUserWithoutTheGrantIsAskedForIt
      - PappuCoreTests/aStaleGrantGetsItsOwnScreenRatherThanTheAskAgain
      - PappuCoreTests/thereIsNothingToShowOnceTheGrantWorks
      - PappuCoreTests/aFreshInstallHasNotBeenWelcomedAndStoresNothing
      - PappuCoreTests/theWelcomeIsOnlyShownOnce
      - PappuCoreTests/theGrantIsNeverWrittenDown
      - PappuCoreTests/theGrantArrivingIsAnnounced
      - PappuCoreTests/finishingAWelcomeTwiceAnnouncesOnce
      - PappuCoreTests/agrantThatHasNotChangedIsNotAnnounced
      - PappuAppTests/aMissingGrantIsTheFirstThingInTheMenu
      - PappuAppTests/aStaleGrantSaysSomethingElse
      - PappuAppTests/anUntestedGrantSaysNothing
      - PappuSettingsTests/theBannerSaysNothingUntilThereIsSomethingToSay
      - PappuSettingsTests/aGrantGivenWhileTheWindowIsOpenTakesTheBannerAway
      - PappuSettingsTests/theBannersButtonOpensTheAccessibilityPaneAndNothingElse
      - PappuAppTests/aFirstRunShowsTheWelcome
      - PappuAppTests/pressingContinueRemembersTheExplanationAndAsksTheSystem
      - PappuAppTests/aSecondLaunchWithoutTheGrantAsksForItRatherThanExplainingAgain
      - PappuAppTests/theGrantArrivingWhileTheWindowIsOpenFinishesIt
      - PappuAppTests/aFirstRunOverAWorkingGrantExplainsItselfAndThenCloses
      - PappuAppTests/theDirectLinkOpensThePaneAndClaimsNothing
      - manual:docs/checklists/m1-manual.md
  ONB-2: { priority: P1, milestone: M6, tests: [] }
  ONB-3: { priority: P1, milestone: M6, tests: [] }
  ONB-4:
    priority: P1
    milestone: M6
    note: >-
      The guided repair is M6. What this build has is the recognition and the sentence: a grant that is
      trusted and still refused is `AccessibilityGrant.stale` rather than missing, `OnboardingState` sends
      it to a screen of its own rather than to the ask again, and the menu and the Settings banner say
      something different about it — remove the app from the list and add it back, not grant Accessibility,
      because the tick the user can see is already there. Walking them through it, and saying so when no
      window is open, are M6's.
    tests:
      - PappuCoreTests/trustedAndRefusedIsStaleRatherThanMissing
      - PappuCoreTests/aStaleGrantGetsItsOwnScreenRatherThanTheAskAgain
      - PappuAppTests/aTrustedProcessWhoseTapWasRefusedIsStale
