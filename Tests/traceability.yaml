      - PappuRuntimeTests/noReportCanHoldTheResultOrTheSelection
      - PappuSelectionTests/putsTheResultUpPostsTheKeystrokeAndTakesItBackDown
      - PappuSelectionTests/leavesAStrangersWriteAloneAndSaysSo
      - PappuSelectionTests/takesTheTextDownAtOnceWhenTheKeystrokeCannotBePosted
      - PappuSelectionTests/noticesAWriteItDestroyedByPuttingTheResultUp
      - PappuSelectionTests/refusesASecondWriteWhileATransactionIsOpen
      - PappuSelectionTests/noRecordCanHoldTheResult
