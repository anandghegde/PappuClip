  ACT-16c:
    priority: P0
    milestone: M1
    note: >-
      The 700 ms cutoff is checked where it matters, after the read and before anything with an
      effect, and what is left of it rides on the permit so that the bar's own work is inside the same
      budget. The synthetic-copy half is the broker's: a copy that lands after the window is restored
      over and reported late rather than used, a foreign write during the drain is left alone, a text
      read that never comes back is abandoned and the clipboard still goes back, and a snapshot that
      will not fit the time that is left is never started.
    tests:
      - PappuSelectionTests/aReadThatOverrunsTheHardCutoffShowsNothing
      - PappuSelectionTests/aBarOnlyAppearsForTheAttemptThatIsStillCurrent
      - PappuSelectionTests/putsTheClipboardBackWhenTheCopyArrivesLate
      - PappuSelectionTests/leavesAForeignWriteDuringTheDrainAlone
      - PappuSelectionTests/restoresEvenWhenTheTextReadIsAbandoned
      - PappuSelectionTests/refusesWhenTheSnapshotCannotBeTakenInTime
      - PappuCoreTests/targetsStayBelowTheHardCutoff
      - PappuCoreTests/targetBudgetAndHardCutoffAreSeparateThresholds
  ACT-17a:
    priority: P0
    milestone: M1
    note: >-
      The rules are `PrivacyRules` and the precedence is `PrivacyGate`'s, both tested over values. What
      says *which* app they are applied to is `FrontmostApp`, and it matters most on the route that has
      no pointer to read an app from: a shortcut is judged against whatever came forward last. It
      ignores our own activations, because opening Settings or the onboarding window would otherwise
      make PappuClip the app in front and a shortcut pressed straight afterwards would be judged
