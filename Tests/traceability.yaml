  # Invocation runtime (safety spec)
  RUN-1a:
    priority: P0
    milestone: M1
    tests:
      - PappuRuntimeTests/theSnapshotHasEverythingTheVerifierWillLaterAskFor
      - PappuRuntimeTests/theSelectionIsKeptAsADigestAndALength
      - PappuRuntimeTests/noFieldOfTheRecordCanHoldTheSelection
      - PappuRuntimeTests/anAppWithNothingToTakeHoldOfStillRuns
      - PappuRuntimeTests/noGrantMeansNoEpochAndTheRecordSaysSo
      - PappuAppTests/theRunIsRecordedAgainstItsAttemptAndItsAction
  RUN-1b:
    priority: P0
    milestone: M1
    tests:
      - PappuRuntimeTests/theWorldMovingOnDoesNotRetargetTheRun
      - PappuRuntimeTests/changesAreKeptInTheOrderTheyHappened
      - PappuRuntimeTests/aSlowActionWhoseUserHasMovedOnWritesNothingAnywhere
  RUN-1c:
    priority: P0
    milestone: M1
    tests:
      - PappuRuntimeTests/focusMovingIntoOurOwnSurfaceIsNotANewDestination
  RUN-2a:
    priority: P0
    milestone: M1
    note: >-
      `MutationPermit.init` is internal to PappuRuntime and `DestinationVerifier` is the only thing
      that calls it, so a mutation path that skips verification does not compile. What the tests add
      is that the verifier itself looks every time, and that a run which is no longer live cannot get
      a permit however the tasks interleave. Which runs are in the mutating class at all is
      `BuiltinAction.mayMutateTheDestination`, and the line is drawn where the keystroke is: Cut and
      Paste press a key into another process, Copy reads a selection we are holding already, and Search
      and Open Link leave the machine. It is what `SelectionBridge` puts on every `InvocationRequest`, so
      a built-in on the wrong side of that line would take no lease and be verified for nothing.
    tests:
      - PappuRuntimeTests/nothingHasMovedSoTheTopTierIsGranted
      - PappuRuntimeTests/theLookIsMadeOnceAndCarriesTheInvocationsOwnRoute
      - PappuRuntimeTests/cancellingEndsEverythingTheRunCouldStillAskFor
      - PappuRuntimeTests/onlyTheTwoThatPressAKeyCanReachTheDestination
      - PappuRuntimeTests/copyIsNotAKeystroke
      - PappuRuntimeTests/theTwoThatLeaveTheProcessTouchNothingInside
  RUN-2b:
    priority: P0
    milestone: M1
    tests:
      - PappuRuntimeTests/nothingHasMovedSoTheTopTierIsGranted
      - PappuRuntimeTests/aClipboardReadInASilentAppIsQuiescenceVerified
      - PappuRuntimeTests/anAccessibilityReadWhoseAppGoesQuietFallsThroughToQuiescence
      - PappuRuntimeTests/aQuiescenceVerifiedPasteTurnsOnWhetherAnythingWasTyped
      - manual:docs/checklists/m1-manual.md
  RUN-2c:
    priority: P0
    milestone: M1
    note: >-
      The refusal is closed, and so is the half of RUN-2d that says nothing is written instead.
      Presenting the result for explicit copy is the bar's half and lands with the built-ins later in
      M1 week 5.
    tests:
      - PappuRuntimeTests/anyOneOfThemGoneIsEnoughToLoseTheTier
      - PappuRuntimeTests/silenceIsNotAgreementAtTheTopTier
      - PappuRuntimeTests/aContradictionIsNotSilenceAndDoesNotFallThrough
      - PappuRuntimeTests/noPolicyReachesTheUnverifiableTier
  RUN-2d:
    priority: P0
    milestone: M1
    note: >-
      There is no auto-copy path to test, and that is the requirement: a blocked verification mints no
      permit, `TextMutator.replaceSelection` cannot be called without one, and it is the only thing in
      the program that puts an action's result on the user's clipboard. The tests hold that absence in
      place — every way a mutation can be refused, and the pasteboard untouched at the end of each.
    tests:
      - PappuRuntimeTests/aBlockedVerificationWritesNothingAtAll
      - PappuRuntimeTests/theUnverifiableTierPermitsNoMutation
      - PappuRuntimeTests/aCancelledRunPastesNothingEvenHoldingAPermit
      - PappuRuntimeTests/aRefusedTransactionIsReportedAndNotRetriedAnotherWay
      - PappuSelectionTests/writesNothingWhenTheClipboardCannotBeReadBack
      - PappuSelectionTests/writesNothingWhenTheSnapshotCannotBeTakenInTime
  RUN-2e:
    priority: P1
    milestone: M3
    completes: M4
    note: "Mechanism in M3; polish in M4. The re-verification it is built on is one call, and a run can make it twice."
    tests:
      - PappuRuntimeTests/theRecordSaysWhichTiersItReachedAndHowItEnded
  RUN-2f:
    priority: P0
    milestone: M1
    tests:
      - PappuRuntimeTests/aRefusalAtExecutionTimeStopsTheLookBeforeItHappens
      - PappuRuntimeTests/secureInputTurningOnUnderARunningActionRefuses
      - PappuRuntimeTests/turningOffAutomaticAppearanceDoesNotBlockAnActionAlreadyRunning
      - PappuRuntimeTests/secureInputStartingUnderARunningActionStopsIt
      - PappuCoreTests/theRecheckStillRefusesSecureInputAHardBlockAndAPause
      - PappuCoreTests/theRecheckDoesNotRunTheAppearanceStep
      - PappuCoreTests/theRecheckSaysItClearedTwoStepsAndNotThree
  RUN-2g:
    priority: P0
    milestone: M1
    note: >-
      Both halves now. The tap side is `EventTapService`'s input epoch and the listen-only lease that
      keeps the key tap installed (ACT-19), first used by the clipboard broker
      (`refusesWhenTheUserTypedDuringTheWindow`, `refusesWhenKeystrokesCannotBeWatched` under
      ACT-10f). The downgrade side is `DestinationVerifier`: an epoch that moved, an app that is no
      longer frontmost, a window that changed, a snapshot past the time window, or a lease that could
      not be taken at all each take the quiescence tier away, and `InvocationManager` holds the lease
      for the life of every run that may mutate text.
    tests:
      - PappuRuntimeTests/oneKeystrokeSinceTheSnapshotEndsTheTier
      - PappuRuntimeTests/noKeyTapMeansNoQuiescenceTier
      - PappuRuntimeTests/theWindowOfTimeCloses
      - PappuRuntimeTests/switchingToAnotherAppEndsBothTiers
      - PappuRuntimeTests/aRunThatMayMutateHoldsTheKeyTapForItsWholeLife
      - PappuRuntimeTests/cancellingGivesTheKeyTapBackToo
      - PappuRuntimeTests/aRunThatCannotMutateTakesNoLeaseAndCarriesNoEpoch
      - PappuRuntimeTests/onlyTheTwoThatPressAKeyCanReachTheDestination
  RUN-2h:
    priority: P0
    milestone: M1
    note: >-
      A policy, and a user's ceiling over it, can take the quiescence tier away. That no policy can
      enable mutation at the unverifiable tier is structural twice over: the schema has no field for
      it, and the verifier mints a permit in exactly two places, neither of them reachable at that
      tier.
    tests:
      - PappuSelectionTests/aUserCeilingTurnsOffQuiescenceThatTheBundledPolicyAllows
      - PappuSelectionTests/aCeilingCanNeverGrant
      - PappuRuntimeTests/aPolicyCanTurnTheMiddleTierOffForAnApp
      - PappuRuntimeTests/noPolicyReachesTheUnverifiableTier
  RUN-3a:
    priority: P0
    milestone: M1
    tests:
      - PappuRuntimeTests/cancellingEndsEverythingTheRunCouldStillAskFor
      - PappuRuntimeTests/aVerificationInFlightWhenTheUserCancelsYieldsNoPermit
      - PappuRuntimeTests/cancellingATwiceEndedRunSaysItWasAlreadyOver
  RUN-3b:
    priority: P0
    milestone: M1
    tests:
      - PappuRuntimeTests/cancellingEndsEverythingTheRunCouldStillAskFor
      - PappuRuntimeTests/aVerificationInFlightWhenTheUserCancelsYieldsNoPermit
  RUN-3c:
    priority: P0
    milestone: M1
    tests:
      - PappuRuntimeTests/cancellingJustBeforeTheEndIsNeverALateSuccess
      - PappuRuntimeTests/cancellingEndsEverythingTheRunCouldStillAskFor
  RUN-3d:
    priority: P0
    milestone: M1
    note: >-
      The seam and the waiting are closed. Terminating an owned script process is `ScriptExecutor`'s
      conformance to `CancellableWork`, in M2.
    tests:
      - PappuRuntimeTests/ownedWorkIsStoppedAndSaidToBeStopped
      - PappuRuntimeTests/workThatWillNotStopEndsTheGraceRatherThanTheWait
      - PappuRuntimeTests/delegatedWorkIsOnlyAskedAndIsNeverCalledStopped
  RUN-3e:
    priority: P0
    milestone: M1
    note: "The report is closed; the sentence the bar shows from it is BAR work in M1 week 5."
    tests:
      - PappuRuntimeTests/delegatedWorkIsOnlyAskedAndIsNeverCalledStopped
      - PappuRuntimeTests/workThatCannotBeStoppedIsReportedAsSuchRatherThanAsStopped
      - PappuRuntimeTests/workThatWillNotStopEndsTheGraceRatherThanTheWait
  RUN-3f:
    priority: P0
    milestone: M1
    tests:
      - PappuRuntimeTests/pauseAndRevocationTakeEverythingInFlightTheSameWay
  RUN-4:
    priority: P0
    milestone: M1
    note: >-
      One action's result is one synthetic ⌘V, which every text system on the Mac already treats as one
      undoable edit; `AXSelectedText` is never written, and the Accessibility seam has no setter to
      write it with. The tests hold the keystroke count and the clipboard's round trip. That the undo
      itself is one step is on the M1 manual checklist, because only a real app's undo manager can say
