# Requirement traceability. Checked by `pappu-dev trace check` in CI.
#
# Every requirement ID in docs/PRD.md and docs/spec/*.md has one entry here, and nothing else does.
#   priority   from the requirement's own table row
#   milestone  where docs/implementation-plan.md §11 lands it; `completes` where a later milestone finishes it
#   tests      `TestTarget/testFunctionName`, or `manual:<path>` for a checklist that a person runs
#
# A P0 or P1 requirement whose milestone is at or before `current_milestone` must list at least one test.
# Raising `current_milestone` is part of closing a milestone (plan §2, definition of done).

