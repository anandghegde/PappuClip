  ACT-9:
    priority: P0
    milestone: M1
    note: >-
      Three pieces, all built. `DetectionPolicy.chain(for:)` answers which strategies run, in what
      order, on each route. `AXSelectionReader` is strategies 1 and 3 — one body, because strategy 3
      *is* strategy 1 with a switch thrown first — on the AX actor, every call bounded by the read
      stage's budget. `SelectionStrategyChain` is the order between them and the single decision each
      answer forces: a strategy that could not run leaves the question open, one that ran and found
      nothing closes it, and only when every strategy has said the first does the attempt come back
      refused. Strategy 5 is `ClipboardBroker`, whose own tests are ACT-10a-j.
      Strategies 2 and 4 are not built and are skipped rather than answered, so a chain containing
      them still reaches strategy 5: strategy 2 wants `AXTextMarkerRange`, an opaque Core Foundation
      type the `AXWorld` seam does not carry, and strategy 4 wants Automation consent and the
      per-browser scripts of M0 spike 3. `SelectionStrategyChain.unimplemented` names both, and a test
      asserts the set, so the day either lands the traceability moves with it.
    tests:
