      - PappuSelectionTests/aSelectionThatMovesBeforeTheReadIsBackRetiresNothing
      - PappuSelectionTests/aSelectionThatMovesAfterTheReadIsBackRetiresTheAttempt
      - PappuSelectionTests/aFocusChangeAfterTheReadIsBackRetiresTheAttempt
      - PappuSelectionTests/onlyTheFirstNoticeRetiresAnAttempt
      - PappuSelectionTests/aNoticeAfterTheAttemptIsOverRetiresNothing
      - PappuSelectionTests/disarmingAnAttemptANewerOneReplacedLeavesTheNewerOneArmed
      - PappuSelectionTests/aReadThatComesBackForAReplacedAttemptDoesNotArmTheNewerOne
      - PappuSelectionTests/aGesturesOwnSelectionNoticeDoesNotStopItsOwnBar
      - PappuSelectionTests/theCoordinatorRegistersWithTheAppItIsReadingAndDisarmsWhenItIsDone
      - PappuSelectionTests/aNoticeFromTheWatchersWithholdsTheBarOfTheAttemptItWasRaisedFor
      - PappuSelectionTests/aNoticeForAnAttemptThatIsOverLeavesTheCurrentOneAlone
      - PappuSelectionTests/theCutoffIsCheckedBetweenStrategiesAndNotOnlyAtTheEnd
  ACT-16b:
    priority: P0
    milestone: M1
    note: >-
      A late completion cannot show a bar because it cannot get the thing a bar needs: `BarPresenting`
