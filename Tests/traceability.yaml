  # Apps and layout management
  ALM-1:
    priority: P0
    milestone: M1
    note: >-
      A requirement kept by not introducing the thing that would break it: `ActionCatalog` is a plain
      ordered array and `BarContent` builds a button for every action it is handed. The tests stand
      two thousand and five hundred actions up respectively — past any real library, and past any
      number a `prefix` somebody added to make a screen look right would have used. How many buttons
      fit on one bar is `BarLayout`'s question and the overflow is BAR-5a's (M4); neither is answered
      by dropping actions here. Settings → Actions is the other surface the list is visible on, read
      only in this build (PRD §7.6; renaming, reordering and per-action commands are ALM-2a, ALM-3a and
      ALM-5): it shows every action in the catalogue in `BuiltinAction.allCases` order, which is the order
      a fresh install has, and an action switched off keeps its place there and says so rather than
