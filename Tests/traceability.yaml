  ACT-5:
    priority: P0
    milestone: M1
    note: >-
      Three parts. The shortcut itself — what may be one, registering it, and the presses coming back —
      the rules it does and does not override, which are the gate's, and the route through
      `ActivationCoordinator.activate(route:)`, which reads the selection with no gesture and no
      baseline behind it. The bar it hands the answer to is `BarController`, built in M1 week 4; the
      shortcut's own bar is `aShortcutBarStartsInKeyboardModeWithTheFirstButtonHighlighted` below. The
      recorder is a fourth part and lives in Settings (PRD §7.5): `ShortcutStore` decides what may be a
      shortcut, and `SettingsModel.record` is where its refusal becomes a sentence the user can read
      rather than a key press that silently did nothing. `ShortcutText` is what the field says at the next
      launch — a shortcut is remembered as a virtual key code, so naming it is a table, and it is the same
      table that decides which function keys may stand alone.
