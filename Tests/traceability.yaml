  ACT-16a:
    priority: P0
    milestone: M1
    note: >-
      `ActivationCoordinator.invalidate(_:)` is the one way an attempt stops being current, and the
      reason is kept per attempt so that a read still out reads its own. The events the coordinator
      sees itself — a newer gesture, a newer press, a scroll, a tap interruption — are wired and
      tested, and so are the two watchers outside it: `AttemptWatcher` holds an `AXObserver` on the app
      the attempt is about and takes `NSWorkspace`'s activation notices, and raises an `AttemptNotice`
      carrying the attempt it was watching, which reaches the coordinator through `watch(_:)` and
      retires that attempt or nothing. Each watcher needs a rule for telling the user moving on from
      the echo of the gesture that started the attempt, because both notices can arrive after mouse-up:
      a selection notice counts only once the read is back, and an activation notice is filtered by
      pid. `SystemAXObserver` and `WorkspaceActivationWatcher` need a live session and are covered by
      no test.
    tests:
      - PappuSelectionTests/aNewerGestureRetiresTheOneStillReading
      - PappuSelectionTests/aShortcutWhileAGestureIsStillReadingRetiresTheGesture
      - PappuSelectionTests/aFocusChangeWhileReadingWithholdsTheBar
      - PappuSelectionTests/anotherApplicationComingForwardWhileReadingWithholdsTheBar
      - PappuSelectionTests/aTapInterruptionRetiresWhateverWasInFlight
      - PappuSelectionTests/anAppComingForwardWhileAnAttemptIsArmedRetiresIt
