  ACT-12:
    priority: P0
    milestone: M1
    note: >-
      The gate refuses on either flag. Reading the flags is split: the system-wide one is
      `SecureInput` in PappuSelection, and the focused element's role is `AXFocusProbe` on the AX
      actor, which reads `AXRole` and `AXSubrole` and never an attribute that can hold text. A role
