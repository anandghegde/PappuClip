    priority: P0
    milestone: M1
    note: >-
      A write the broker did not cause must never be read as the selection. Two of the three shapes
      are decidable from the count and the app's delta; the third is not. A first writer that lands
      between the clear and the app's own copy is indistinguishable from the copy, and the only thing
      that catches it is a length the accessibility read took moments earlier, which is why the permit
      carries `expectedCharacters`. Where no length is available the hole stays open and is written
      down in architecture §5 rather than papered over; spike 6 hit it 10 times out of 10.
    tests:
