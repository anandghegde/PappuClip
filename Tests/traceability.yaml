      - PappuSelectionTests/aDeliberateRouteMayUseSyntheticCopyWhereTheAutomaticPathMayNot
      - PappuSelectionTests/strategyThreeIsDroppedWhenTheAppHasNoAttributeToEnableAndKeptWhenItHasOne
