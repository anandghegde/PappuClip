# Work the plan closes that the PRD describes in prose, without a numbered ID.
sections:
  "PRD §7.4 built-ins (Cut, Copy, Paste, Search, Open Link)":
    milestone: M1
    completes: M3
    note: >-
      The reserved `builtin` executor: `BuiltinRunner`, over the five manifests in
      `Resources/BuiltinExtensions/`, through the same resolver, lifecycle and clipboard broker as
      anything a user will install. Two departures from the §7.4 table in M1, both waiting on the
      rich-text model (FLT-4, M3). **Copy is a kept clipboard write, not a synthetic ⌘C**: a ⌘C is
      synthetic input, RUN-2 grants a permit only for an editable destination, and Copy is offered
      wherever there is text — so a permit-shaped Copy could never run on a web page. M1 has no rich
      flavours to lose, so the result is the same. **⇧ Cut and ⇧ Copy ("plain text only") do nothing
      different**, for the same reason: there is no rich capture yet to strip. ⇧ Paste, ⇧/⌥ Search
      and ⇧/⌥ Open Link are all here. Migrated to the public API in M3.
    tests:
      - PappuRuntimeTests/cutPostsTheAppsOwnKeystrokeAndNothingElse
      - PappuRuntimeTests/cutIntoAnUnverifiableDestinationPostsNothing
      - PappuRuntimeTests/copyWritesTheSelectionWhereNoPermitCouldEverBeMinted
      - PappuRuntimeTests/copyIsNotHiddenFromClipboardManagers
      - PappuRuntimeTests/pastePostsTheKeystrokeAndLeavesTheClipboardWhereItWas
      - PappuRuntimeTests/shiftPasteHoldsThePlainTextAndGivesTheClipboardBack
      - PappuRuntimeTests/shiftPasteWithAnEmptyClipboardDoesNothing
      - PappuRuntimeTests/searchOpensThePreferredEngineWithTheTermEncoded
      - PappuRuntimeTests/searchModifiersQuoteTheTermAndKeepTheBrowserBehind
      - PappuRuntimeTests/searchFromABrowserOpensInThatBrowser
      - PappuRuntimeTests/searchUsesTheUsersOwnTemplateWhenItHasThePlaceholder
      - PappuRuntimeTests/searchThatDoesNotOpenIsNotReportedAsDone
      - PappuRuntimeTests/openLinkOpensEveryAddressInOrder
      - PappuRuntimeTests/optionOpenLinkCopiesTheAddressesAndOpensNothing
      - PappuRuntimeTests/shiftOpenLinkOpensBehind
      - PappuRuntimeTests/aCancelledRunPostsNothing
      - PappuSelectionTests/replacesTheClipboardAndLeavesItThere
      - PappuSelectionTests/doesNotHideTheTextFromClipboardManagers
      - PappuSelectionTests/writesEvenWhereAReadWouldPrompt
      - PappuSelectionTests/refusesWhileATransactionIsOpen
      - PappuSelectionTests/noticesAWriteTheClearDestroyed
      - PappuSelectionTests/readsThePlainTextOnTheClipboard
      - PappuSelectionTests/doesNotReadWhereItWouldPrompt
      - PappuSelectionTests/noRecordCanHoldWhatWasWritten
